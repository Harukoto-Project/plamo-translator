[package]
name = "plamo-translator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PLaMo翻訳モデル(pfnet/plamo-2-translate)向けの翻訳デスクトップアプリ"
default-run = "plamo-translator"

[lib]
# Windows で bin 名と衝突しないよう、`_lib` を付ける
# https://github.com/rust-lang/cargo/issues/8519
name = "plamo_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 型の生成ツール。`export-bindings`機能を付けたときだけビルドする(`pnpm bindings`)。
# 付けないと、`tauri build`がこれも配布物に含めようとし、macOSのユニバーサルビルドが
# 「export-bindingsが見つからない」で失敗する
[features]
export-bindings = []

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["export-bindings"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
plamo-translator-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
# `tauri.conf.json`の`plugins`を読み込むマクロ(`generate_context!`)が使う
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

# 自動更新(デスクトップのみ)。モバイルは更新の仕組みが別なので入れない
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
